name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: planejai
          POSTGRES_PASSWORD: planejai
          POSTGRES_DB: planejai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planejai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai?sslmode=disable
      TEST_DATABASE_URL: postgres://planejai:planejai@localhost:5432/planejai?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply migrations (goose)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          "$(go env GOPATH)/bin/goose" -dir migrations postgres "$DATABASE_URL" up

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  frontend:
    name: Frontend (NextJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
